kind = "web"
previewPath = "/"
title = "Tec-code//Rover"
version = "1.0.0"
id = "artifacts/rover-control"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24407

[services.development]
run = "pnpm --filter @workspace/rover-control run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rover-control", "run", "build" ]
publicDir = "artifacts/rover-control/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24407"
BASE_PATH = "/"
